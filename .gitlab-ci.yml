# ============================================================
# Winaity Template Builder — CI Pipeline
# ============================================================

stages:
  - lint
  - test
  - build

default:
  interruptible: true

# ============================================================
# LINT STAGE
# ============================================================

lint:auth-service:
  stage: lint
  image: node:20-bookworm-slim
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - auth-service/**/*
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH
      changes:
        - auth-service/**/*
        - .gitlab-ci.yml
  cache:
    key:
      files:
        - auth-service/package-lock.json
    paths:
      - auth-service/node_modules/
  before_script:
    - cd auth-service
    - npm ci --prefer-offline --no-audit
  script:
    - npm run lint

