# ============================================================
# Winaity Template Builder — CI Pipeline
# ============================================================
# Stages run in order. Jobs within a stage run in parallel.
# Each job is scoped to its service via `rules: changes:`
# so we only spend runner time on what actually changed.
# ============================================================

stages:
  - lint
  - test
  - build

# ---- Global defaults ----
default:
  # Cancel old pipelines if a new commit comes in
  interruptible: true

# ============================================================
# LINT STAGE
# ============================================================

lint:auth-service:
  stage: lint
  image: node:20-bookworm-slim
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - auth-service/**/*
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH
      changes:
        - auth-service/**/*
        - .gitlab-ci.yml
  cache:
    key:
      files:
        - auth-service/package-lock.json
    paths:
      - auth-service/node_modules/
  before_script:
    - cd auth-service
    - npm ci --prefer-offline --no-audit
  script:
    - npm run lint