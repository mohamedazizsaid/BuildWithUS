version: '3.8'

services:
  # ─── Databases ───
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: winaity
      POSTGRES_PASSWORD: winaity123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U winaity"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Message Broker ───
  nats:
    image: nats:2-alpine
    restart: always
    ports:
      - "4222:4222"
      - "8222:8222"

  # ─── Service Discovery ───
  consul:
    image: hashicorp/consul:latest
    restart: always
    ports:
      - "8500:8500"
    command: agent -dev -ui -client=0.0.0.0

  # ─── File Storage ───
  minio:
    image: minio/minio:latest
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: winaity
      MINIO_ROOT_PASSWORD: winaity123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  # ─── Auth Service ───
  auth-service:
    build: ./auth-service
    restart: always
    ports:
      - "50055:50055"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: winaity
      DB_PASSWORD: winaity123
      DB_NAME: auth_db
      GRPC_PORT: 50055
      JWT_SECRET: your-secret-key-change-in-production
    depends_on:
      postgres:
        condition: service_healthy

  # ─── Template Service ───
  template-service:
    build:
      context: .
      dockerfile: template-service/Dockerfile
    restart: always
    ports:
      - "50054:50054"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: winaity
      DB_PASSWORD: winaity123
      DB_NAME: templates_db
      GRPC_PORT: 50054
      NATS_URL: nats://nats:4222
    depends_on:
      postgres:
        condition: service_healthy

  # ─── API Gateway ───
  api-gateway:
    build: ./api-gateway
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      AUTH_SERVICE_URL: auth-service:50055
      TEMPLATE_SERVICE_URL: template-service:50054
      AUTH_PROTO_PATH: /auth-proto/auth.proto
      TEMPLATE_CMD_PROTO_PATH: /template-proto/template_commands.proto
      TEMPLATE_QUERY_PROTO_PATH: /template-proto/template_queries.proto
    volumes:
      - ./auth-service/proto:/auth-proto
      - ./packages/proto:/template-proto
    depends_on:
      - auth-service
      - template-service

volumes:
  postgres_data:
  minio_data:
