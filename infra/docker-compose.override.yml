services:
  auth-service:
    build:
      dockerfile: Dockerfile.dev
    volumes:
      - ../auth-service/src:/app/src
      - ../auth-service/tsconfig.json:/app/tsconfig.json
      - ../auth-service/nest-cli.json:/app/nest-cli.json
      # proto is read at gRPC server startup — mount it so edits don't require
      # a full image rebuild (a `docker compose restart auth-service` is enough)
      - ../auth-service/proto:/app/proto:ro
      # anonymous volume prevents host node_modules from clobbering container's
      - /app/node_modules
    environment:
      # for nest --watch on Windows bind mounts (filesystem events don't bubble through)
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
  template-service:
    build:
      dockerfile: template-service/Dockerfile.dev
    volumes:
      - ../template-service/src:/workspace/template-service/src
      - ../template-service/tsconfig.json:/workspace/template-service/tsconfig.json
      - ../template-service/nest-cli.json:/workspace/template-service/nest-cli.json
      - ../template-service/ormconfig.ts:/workspace/template-service/ormconfig.ts
      # generated proto TS is compiled into the service — mount it so proto edits
      # (e.g. adding the SMS enum) don't require a full image rebuild, matching
      # how auth-service mounts its proto dir
      - ../template-service/proto:/workspace/template-service/proto:ro
      - ../packages/proto:/workspace/packages/proto:ro
      # shared-kernel is consumed as compiled dist — mount the rebuilt output so
      # value-object changes (e.g. the SMS campaign type) reach the container
      # without a full image rebuild (run `npm run build` in packages/shared-kernel)
      - ../packages/shared-kernel/dist:/workspace/packages/shared-kernel/dist:ro
      - /workspace/template-service/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"    
  api-gateway:
    volumes:
      - ../api-gateway/src:/app/src
      - ../api-gateway/tsconfig.json:/app/tsconfig.json
      # protos are loaded via ../../auth-service/proto/auth.proto from __dirname
      # so we need those folders mounted too
      - ../auth-service/proto:/auth-service/proto:ro
      - ../packages/proto:/packages/proto:ro
      - /app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"

  frontend:
    volumes:
      # Single bind mount of the whole frontend dir so newly-created files
      # (not just edits to existing ones) propagate without docker-compose
      # recreate — Docker Desktop on Windows misses new files when each
      # subdir is mounted individually.
      - ../frontend:/app
      # anonymous volumes keep container-managed dirs untouched by host
      - /app/node_modules
      - /app/.next
    environment:
      # Polling watchers re-scan the tree on an interval instead of relying on
      # inotify events that don't bubble through Docker Desktop's bind mount on
      # Windows. Shorter intervals = faster HMR but more CPU; 300ms is a good
      # middle ground.
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
      WATCHPACK_POLLING: "300"
      # Turbopack uses native watching — polling helps when native fs events fail on Windows
      TURBOPACK_WATCH_POLLING: "true"

  ai-template-service:
    build:
      dockerfile: Dockerfile.dev
    volumes:
      - ../ai-template-service:/app

  image-pipeline:
    build:
      dockerfile: Dockerfile.dev
    volumes:
      - ../image-pipeline:/app    