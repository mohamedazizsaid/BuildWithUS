# ──────────────────────────────────────────────────────────────────────────────
# render.yaml — Render Blueprint (Infrastructure as Code)
# https://render.com/docs/blueprint-spec
#
# Deploy all backend services in one click.
# 1. Push this file to your GitHub repository root.
# 2. Go to Render Dashboard → Blueprints → New Blueprint Instance.
# 3. Connect your GitHub repo — Render will read this file automatically.
# ──────────────────────────────────────────────────────────────────────────────

databases:
  # ── Shared PostgreSQL instance ──────────────────────────────────────────────
  - name: buildwithus-db
    databaseName: buildwithus
    user: winaity
    plan: free          # Upgrade to "starter" or higher for production SLA
    region: frankfurt   # Pick the region closest to your users
    ipAllowList: []     # Open to all Render services (private network only)

services:
  # ── auth-service (HTTP Web Service) ─────────────────────────────────────────
  - type: web
    name: auth-service
    runtime: docker
    dockerfilePath: ./auth-service/Dockerfile
    dockerContext: ./auth-service
    region: frankfurt
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        fromDatabase:
          name: buildwithus-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: buildwithus-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: buildwithus-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: buildwithus-db
          property: password
      - key: DB_NAME
        value: buildwithus   # Single shared Render DB — auth tables live here
      - key: DB_SYNC
        value: "true"    # Creates/updates tables on boot. Safe for entities synchronization.
      - key: JWT_SECRET
        sync: false   # Set a strong random secret (min 64 chars). Use the same value in api-gateway

  # ── template-service (HTTP Web Service) ──────────────────────────────────────
  - type: web
    name: template-service
    runtime: docker
    dockerfilePath: ./template-service/Dockerfile
    dockerContext: ./           # Repo root — needs packages/shared-kernel
    region: frankfurt
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        fromDatabase:
          name: buildwithus-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: buildwithus-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: buildwithus-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: buildwithus-db
          property: password
      - key: DB_NAME
        value: buildwithus   # Single shared Render DB — template tables live here
      - key: DB_SYNC
        value: "true"    # Creates/updates tables on boot. Safe for entities synchronization.

  # ── ai-template-service (Web Service) ────────────────────────────────────────
  - type: web
    name: ai-template-service
    runtime: docker
    dockerfilePath: ./ai-template-service/Dockerfile
    dockerContext: ./ai-template-service
    region: frankfurt
    plan: free
    envVars:
      - key: PORT
        value: "8001"
      - key: AI_MODEL
        value: deepseek/deepseek-v3.2
      - key: OPENROUTER_API_KEY
        sync: false   # Set in Render dashboard
      - key: FRONTEND_ORIGIN
        sync: false   # Set to your Vercel domain

  # ── image-pipeline (Web Service) ─────────────────────────────────────────────
  - type: web
    name: image-pipeline
    runtime: docker
    dockerfilePath: ./image-pipeline/Dockerfile
    dockerContext: ./image-pipeline
    region: frankfurt
    plan: free
    envVars:
      - key: PORT
        value: "8002"
      - key: PEXELS_API_KEY
        sync: false   # Set in Render dashboard
